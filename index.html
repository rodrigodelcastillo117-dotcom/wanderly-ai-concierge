    <meta name='impact-site-verification' value='2cb07538-269f-4a5c-a529-6569e086da11'>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Abre la conexión (DNS + TLS) con Supabase mientras se descarga el JS: la primera
         llamada (sesión, datos) ya no paga ese viaje extra en móvil. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <!-- Tipografías propias (mismo dominio): se piden junto con el JS, no después del CSS. -->
    <link rel="preload" href="/fonts/manrope-latin-v20.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Fraunces (titulares y la marca "Iato") se precarga en todas las pantallas MENOS las de texto (Ayuda y
         legales): ahí no hay titular con serifa y sus 67 KB competían con el JS de la primera pintura
         (ronda 2, P2-4: /ayuda pasó de ~2.4 s a ~2.1 s de LCP con 4G lento simulado). Ahí carga normal, con swap. -->
    <script>(function(){try{if(/^\/(ayuda|terminos|privacidad|cookies|reembolsos)\/?$/.test(location.pathname))return;var l=document.createElement("link");l.rel="preload";l.as="font";l.type="font/woff2";l.crossOrigin="anonymous";l.href="/fonts/fraunces-latin-v38.woff2";document.head.appendChild(l);}catch(e){}})();</script>
